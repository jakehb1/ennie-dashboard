<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ennie Support{% endblock %} — Charlie Goldsmith</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
  <script>
    // Apply saved theme before first paint to avoid a flash
    try { if (localStorage.getItem('ennie-theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
    // Inline (not in app.js) so the toggle works even with a stale cached app.js
    function toggleTheme() {
      const light = document.documentElement.classList.toggle('light');
      try { localStorage.setItem('ennie-theme', light ? 'light' : 'dark'); } catch (e) {}
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    .ennie-loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .ennie-loader-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .ennie-loader-anim {
      width: 180px;
      height: 158px;
    }
  </style>
</head>
<body>

<!-- Ennie Lottie loader -->
<div class="ennie-loader-overlay" id="ennie-loader">
  <div class="ennie-loader-anim" id="ennie-lottie"></div>
</div>
<script>
  (function() {
    var anim = null;
    function hideLoader() {
      document.getElementById('ennie-loader').classList.add('fade-out');
      setTimeout(function() { if (anim) { try { anim.destroy(); } catch (e) {} anim = null; } }, 700);
    }
    // Never let a failed CDN script leave the loader stuck over the page
    setTimeout(hideLoader, 5000);
    try {
      anim = lottie.loadAnimation({
        container: document.getElementById('ennie-lottie'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: '{{ url_for("static", filename="ennie-loader.json") }}'
      });
    } catch (e) { hideLoader(); return; }
    window.addEventListener('load', function() {
      setTimeout(hideLoader, 1800);
    });
  })();
</script>

{% if session.user %}
<nav class="glass-nav">
  <div class="nav-brand">
    <img src="{{ url_for('static', filename='ennie-logo.jpg') }}" alt="Ennie" class="nav-logo-img">
  </div>

  <div class="nav-links">
    <a href="{{ url_for('inbox_page') }}"
       class="nav-link{% if request.endpoint in ('inbox_page', 'dashboard') %} active{% endif %}">
      Inbox
    </a>
    <a href="{{ url_for('escalations_page') }}"
       class="nav-link{% if request.endpoint == 'escalations_page' %} active{% endif %}">
      Escalations
    </a>
    <a href="{{ url_for('lookup_page') }}"
       class="nav-link{% if request.endpoint == 'lookup_page' %} active{% endif %}">
      Lookup
    </a>
    <a href="{{ url_for('timesheet_page') }}"
       class="nav-link{% if request.endpoint == 'timesheet_page' %} active{% endif %}">
      Timesheet
    </a>
  </div>

  <div class="nav-search">
    <input type="text" id="global-search" placeholder="Search emails…" autocomplete="off" spellcheck="false">
    <div id="search-results" class="search-dropdown"></div>
  </div>

  <div class="nav-user">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <span class="user-name">{{ session.display_name }}</span>
    <a href="{{ url_for('logout') }}" class="nav-link logout">Sign out</a>
  </div>
</nav>
{% endif %}

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- Toast container -->
<div id="toast" class="toast"></div>

<script src="{{ url_for('static', filename='app.js') }}?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
